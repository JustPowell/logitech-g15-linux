[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "g15lcd"
version = "0.1.0"
description = "User-level daemon for the Logitech G15 (gen 1) monochrome LCD"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pillow"]

[project.optional-dependencies]
sysstats = ["psutil"]
media = ["dbus-python"]
keys = ["evdev"]

[project.scripts]
g15lcd = "g15lcd.daemon:main"
g15ctl = "g15lcd.ctl:main"

[tool.setuptools]
packages = ["g15lcd", "g15lcd.pages"]
