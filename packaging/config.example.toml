# Copy to ~/.config/g15lcd/config.toml (or pass --config PATH). All keys optional.

# Pages in button-cycling order. Each name is a module in g15lcd/pages/.
# "custom" is required for `g15ctl text` / `g15ctl image`.
pages = ["clock", "sysstats", "gpu", "media", "custom"]

[notify]
# How long `g15ctl notify` messages stay up unless -s/--seconds is given.
default_seconds = 5

# Mirror desktop pop-ups (org.freedesktop.Notifications) onto the LCD. Off by default:
# this copies notification text onto a physical screen anyone nearby can read.
# Needs python-dbus and python-gobject. Uncomment to enable.
# [notify.desktop]
# enabled = true
# include_apps = []        # app names to show (case-insensitive); empty = all
# exclude_apps = []        # app names never shown
# min_urgency = "normal"   # "low" | "normal" | "critical"
# hide_body = false        # true: show only app + summary, never the message text
# show_app = true          # app name as the title line; false: summary as title
# seconds = 5              # display time; default = default_seconds above (critical: 2x, max 300)

[backlight]
# Level used when the backlight is toggled on (MENU1 button / `g15ctl backlight toggle`): 1 or 2.
on_level = 2

# Per-page options: [page.<name>] tables are passed as keyword arguments to the
# page constructor. Pages that don't accept an option log a warning and ignore it.
# [page.sysstats]
# interval = 2.0

# [page.gpu]   # amdgpu only (sysfs); MENU4/MENU5 toggle summary / detail view
# card = "card1"   # card name or index; default: the amdgpu with the most VRAM
# interval = 1.0
# busy_rate = 10     # Hz at which GPU load / memory-bandwidth are read, 1..50
# busy_window = 2.5  # seconds those two values are averaged over (> 0)

# [page.media]
# scroll_speed = 8.0   # long-title marquee speed in px/s (> 0); slow suits the ghosting LCD
# scroll_pause = 3.0   # seconds the title rests at the start before each pass (>= 0)
